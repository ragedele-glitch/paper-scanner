<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e1116">
<title>Rage Meme Bot</title>
<style>
:root{--bg:#0e1116;--card:#171b22;--line:#252b35;--tx:#e6e9ef;--mut:#8a93a3;--g:#22c55e;--r:#ef4444;--y:#eab308;--b:#3b82f6}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.title{font-weight:700;font-size:16px}.paper{font-size:11px;font-weight:700;color:#111;background:var(--y);border-radius:4px;padding:2px 6px;margin-left:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%}.on{background:var(--g);box-shadow:0 0 8px var(--g)}.off{background:var(--r)}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;border:0;color:var(--mut);font:inherit;font-weight:600;padding:8px 10px;border-bottom:2px solid transparent}
nav button.act{color:var(--tx);border-color:var(--b)}
main{padding:12px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.big{font-size:30px;font-weight:700}.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.m{color:var(--mut)}.s{font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv{background:#11151b;border-radius:8px;padding:8px}.kv b{display:block;font-size:17px}.kv span{font-size:12px;color:var(--mut)}
.row{border-top:1px solid var(--line);padding:10px 0}.row:first-child{border-top:0;padding-top:0}
.rh{display:flex;justify-content:space-between;gap:8px;font-weight:600}.rd{font-size:13px;color:var(--mut);margin-top:3px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 7px;border-radius:5px;margin-top:4px}
.t-copied{background:#123d24;color:#4ade80}.t-killed{background:#3d1414;color:#f87171}.t-passed{background:#13284a;color:#93c5fd}.t-skip,.t-ignored{background:#262b33;color:#aab2bf}
.bar{display:flex;gap:2px;height:22px;margin:6px 0}.bar i{flex:1;border-radius:2px}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.filt button{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px}.filt button.act{background:var(--b);border-color:var(--b)}
.warn{background:#3a1d0d;border:1px solid #7c2d12;color:#fed7aa;border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px}
.empty{color:var(--mut);text-align:center;padding:18px 0}
svg{display:block;width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;text-align:right;border-top:1px solid var(--line)}td:first-child,th:first-child{text-align:left}th{color:var(--mut);font-weight:600}
footer{color:var(--mut);font-size:12px;text-align:center;padding:4px 12px 24px}
.lv .dot{display:inline-block;width:7px;height:7px;margin-right:5px;background:var(--g);vertical-align:middle}.fu{animation:fu 1.2s}.fd{animation:fd 1.2s}@keyframes fu{from{background:rgba(34,197,94,.35)}to{background:transparent}}@keyframes fd{from{background:rgba(239,68,68,.35)}to{background:transparent}}
.rbadge{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:6px;letter-spacing:.05em}.rb-dry{background:#13284a;color:#93c5fd}.rb-live{background:#7f1d1d;color:#fff}.rb-off{background:#262b33;color:#aab2bf}.rbig{display:block;text-align:center;font-weight:700;font-size:16px;padding:12px;border-radius:10px;margin-top:8px;text-decoration:none}.rb-stop{background:#b91c1c;color:#fff}.rb-pause{background:#a16207;color:#fff}.rb-go{background:#15803d;color:#fff}.rb-lock{background:#1d4ed8;color:#fff}.rb-lock.on{background:#2563eb;box-shadow:0 0 0 2px #93c5fd inset}.rb3{display:flex;gap:8px}.rb3 .rbig{flex:1 1 0;min-width:0;margin-top:0;font-size:15px;padding:12px 4px;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center}.rb3 .rbig small{font-size:11px;font-weight:600;opacity:.9}
</style></head><body>
<header>
 <div class="top"><div class="title">Rage Meme Bot<span class="paper">PAPER</span></div><div id="pill" class="pill"><span class="dot"></span>Loading…</div></div>
 <nav id="nav"></nav>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<footer id="foot">The paper accounts use no wallet, no keys and no real money. Rage Radium Bot has its own page. This page can only watch.</footer>
<script>
const TABS=[["ov","Overview"],["pos","Positions"],["hist","History"],["sig","Signals"],["stats","Stats"],["log","Activity"],["wal","Wallets"]];
const OWNER="ragedele-glitch",REPO="paper-scanner";
let K=location.hash.slice(1);if(K.length>20){try{localStorage.setItem("pk",K)}catch(e){}}else{try{K=localStorage.getItem("pk")||""}catch(e){}}
let tab=(()=>{try{const t=localStorage.getItem("tab")||"ov";return t=="rad"?"ov":t}catch(e){return"ov"}})(),S=null,sigF="all",lastOk=0,errMsg="";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const usd=(v,d=2)=>v==null?"–":(v<0?"-$":"$")+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(v,d=2)=>v==null?"–":(v>=0?"+":"-")+"$"+Math.abs(v).toFixed(d);
const pct=(v,d=1)=>v==null?"–":(v>=0?"+":"")+v.toFixed(d)+"%";
const cls=v=>v==null?"m":v>0?"g":v<0?"r":"m";
function px(v){if(v==null)return"–";if(v>=1)return"$"+v.toFixed(4);const s=v.toPrecision(3);if(v>=1e-4)return"$"+Number(s);const m=v.toExponential(2).split("e");return"$"+m[0]+"e"+m[1]}
const T=ts=>ts?new Date(ts*1000).toLocaleString("en-GB",{timeZone:"Africa/Lagos",weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hour12:true}):"–";
const TT=ts=>ts?new Date(ts*1000).toLocaleTimeString("en-GB",{timeZone:"Africa/Lagos",hour:"2-digit",minute:"2-digit",hour12:true}):"–";
const D=ts=>ts?new Date(ts*1000).toLocaleDateString("en-GB",{timeZone:"Africa/Lagos",weekday:"short",day:"numeric",month:"short"}):"–";
function ago(s){s=Math.max(0,s);if(s<60)return Math.round(s)+"s ago";if(s<3600)return Math.round(s/60)+" min ago";if(s<86400)return(s/3600).toFixed(1)+" h ago";return(s/86400).toFixed(1)+" days ago"}
function dur(s){if(s<3600)return Math.round(s/60)+" min";if(s<86400)return(s/3600).toFixed(1)+" h";return(s/86400).toFixed(1)+" d"}
function nav(){$("#nav").innerHTML=TABS.map(([k,n])=>`<button class="${k==tab?"act":""}" onclick="go('${k}')">${n}${k=="pos"&&S?` (${S.positions.length})`:""}</button>`).join("")}
function go(k){tab=k;try{localStorage.setItem("tab",k)}catch(e){};render();scrollTo(0,0)}
function pill(){const st=S.status,el=$("#pill");el.innerHTML=st.awake?`<span class="dot on"></span>Running`:`<span class="dot off"></span>Asleep`}
function curve(pts){if(pts.length<2)return'<div class="empty">Curve appears after the first data points.</div>';
 const W=600,H=170,P=6,xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys,200),y1=Math.max(...ys,200);if(y1-y0<2){y0-=1;y1+=1}
 const X=x=>P+(x-x0)/(x1-x0||1)*(W-2*P),Y=y=>H-P-(y-y0)/(y1-y0)*(H-2*P);
 const d=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join("");const last=ys[ys.length-1],col=last>=200?"#22c55e":"#ef4444";
 return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:170px"><line x1="0" x2="${W}" y1="${Y(200)}" y2="${Y(200)}" stroke="#3a4250" stroke-dasharray="4 4"/><path d="${d} L${X(x1)},${H} L${X(x0)},${H}Z" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" vector-effect="non-scaling-stroke"/></svg><div class="rd" style="display:flex;justify-content:space-between"><span>${T(x0)}</span><span>dashed line = $200 start</span><span>now</span></div>`}
function upbar(u){return `<div class="bar">${u.cells.map(c=>`<i title="${T(c.h)}: ${c.pct}%" style="background:${c.pct>=90?"#22c55e":c.pct>=30?"#eab308":c.pct>0?"#7c2d12":"#2a303a"}"></i>`).join("")}</div><div class="rd" style="display:flex;justify-content:space-between"><span>48 h ago</span><span>each block = 1 hour awake</span><span>now</span></div>`}
function errs(st){if(!st.errors.length)return'<div class="s g">No data-source errors in the last 15 minutes.</div>';return st.errors.map(e=>`<div class="s"><span class="r">●</span> ${esc(e.what)} — ${e.count}×, last ${TT(e.last)}</div>`).join("")}
function posCard(p){const k=esc(p.coin+"|"+p.entry_ts);return `<div class="row"><div class="rh"><span>${esc(p.coin)} <span class="m s">${esc(p.mint)}</span></span><span data-lvh="${k}" class="${cls(p.pnl)}">${sgn(p.pnl)} (${pct(p.pnl_pct)})</span></div>
<div class="lv" data-lv="${k}"></div>
<div class="rd">Bought ${usd(p.size)} at ${px(p.entry_price)} · bot's last price ${px(p.now_price)} <span class="m">(${(p.price_src||"").indexOf("live-")==0?"live "+(p.price_src=="live-jupiter"?"Jupiter":"DexScreener")+" price, stops checked every few seconds, ":p.price_src=="jupiter"||p.price_src=="dexscreener"?"live "+(p.price_src=="jupiter"?"Jupiter":"DexScreener")+" price, no candles for this coin, ":"from a 1-minute candle, "}${ago(p.price_age+(S.now-S.gen))})</span></div>${p.price_age+(S.now-S.gen)>600?`<div class="rd r">No fresh price for this coin in ${dur(p.price_age+(S.now-S.gen))}: the bot can't check its stop until a price comes in</div>`:""}
<div class="rd">Stop ${px(p.stop)} (${pct(p.stop_pct,0)} from entry, ${p.stop_kind=="trailing"?"trailing, profit locked":p.stop_kind=="breakeven"?"at breakeven":"starting stop"}) · best so far ${pct(p.peak_pct,0)}</div>${p.half?`<div class="rd g">Half sold at ${p.half.x.toFixed(1)}x for ${usd(p.half.got)} · the rest rides under the trail</div>`:""}
<div class="rd">Copied ${esc(p.wallet)} · open ${dur(S.now-p.entry_ts)} (since ${T(p.entry_ts)})</div><div class="rd">${b15Tag(p.exits_label)}</div>${p.alts?altLine(p.alts):""}</div>`}
function histCard(h){return `<div class="row"><div class="rh"><span>${esc(h.coin)} <span class="m s">${esc(h.mint)}</span></span><span class="${cls(h.pnl)}">${sgn(h.pnl)} (${pct(h.pnl_pct)})</span></div>
<div class="rd">${px(h.entry_price)} → ${px(h.exit_price)} · ${usd(h.size)} in · after all costs</div>
<div class="rd">${esc(h.reason)} · held ${dur(h.exit_ts-h.entry_ts)} · closed ${T(h.exit_ts)}</div><div class="rd">Copied ${esc(h.wallet)}</div><div class="rd">${b15Tag(h.exits_label)}</div>${h.half?`<div class="rd">Half sold at ${h.half.x.toFixed(1)}x for ${usd(h.half.got)}, rest sold at the exit</div>`:""}${h.stop_fill?`<div class="rd m">Stop at ${px(h.stop_fill.stop)}, filled at ${px(h.stop_fill.fill)} (${h.stop_fill.fill<h.stop_fill.stop?`<span class="r">${pct((h.stop_fill.fill/h.stop_fill.stop-1)*100,0)} slippage</span>`:"at the stop"}, from ${esc(h.stop_fill.src)})</div>`:""}${h.alts?altLine(h.alts):""}${h.fill?fillLine(h.fill):""}</div>`}
function b15Tag(l){if(!l)return"";const on=l.indexOf("With")==0;return `<span class="tag" style="background:${on?"rgba(46,160,67,.18)":"rgba(140,140,140,.18)"};color:${on?"var(--g)":"var(--mut)"}">${esc(l)}</span>`}
function b15Acct(){return `<div class="rd" style="margin:4px 0">${b15Tag(S.be15?S.be15.label:"With +15% breakeven")} <span class="m s">${esc(S.be15?S.be15.note:"+15% breakeven switched on Sat 7 Nov, live from the next bot run (around 8:30 PM)")}</span></div>`}
function altLine(al){return Object.values(al).map(a=>`<div class="rd m">${esc(a.label)}: ${a.open?"still being followed":`<b class="${cls(a.pnl)}">${sgn(a.pnl)}</b> · ${esc(a.reason||"")}`}</div>`).join("")}
function exitsCard(){const E=S.exits;if(!E)return"";let warn=false;const rows=E.groups.map(g=>{const alts=Object.entries(g.alts).map(([k,a])=>{if(a.worse)warn=true;return !a.n?`<div class="rd m">vs ${esc(a.label.toLowerCase())}: no finished trades yet</div>`:`<div class="rd">vs ${esc(a.label.toLowerCase())}: new exits <b class="${cls(a.new_pnl)}">${sgn(a.new_pnl)}</b> (${a.new_wins} won, ${a.new_losses} lost) · ${esc((E.short||{old_exits:"old exits",no_stop_be:"without the stop rules"})[k]||k)} <b class="${cls(a.alt_pnl)}">${sgn(a.alt_pnl)}</b> (${a.alt_wins} won, ${a.alt_losses} lost) · ${a.n} trades, ${a.differ} differed · ${a.worse?'<b class="r">NEW EXITS DOING WORSE</b>':a.meaningful?'<span class="g">new exits ahead or level</span>':'<span class="m">too early to judge</span>'}</div>`}).join("");return `<div class="row"><div class="rh"><span>${esc(g.label)}</span><span class="m s">${g.n} finished${g.waiting?`, ${g.waiting} still followed`:""}</span></div>${alts}</div>`}).join("");
 return `<div class="card"><h3>With +15% breakeven vs old exits, same trades</h3>${warn?'<div class="r" style="margin-bottom:6px"><b>Warning: the new exits are doing worse than a comparison over a meaningful number of trades.</b></div>':""}<div class="rd m" style="margin-bottom:6px">New exits (${S.be15?esc(S.be15.label):"With +15% breakeven"}): $5 max-loss stop, breakeven from +15%, half sold at 2x, trail widening to 40% past 3x. "${S.be15?esc(S.be15.off_label):"Old exits, no +15% breakeven"}" is the same without the +15% breakeven (breakeven only from +50%), followed on trades opened from ${S.be15&&S.be15.on_ts?D(S.be15.on_ts):"Sat 7 Nov"}. Judged once ${E.min_trades} trades have finished with at least ${E.min_differ} that differ; worse means less money or more losing trades.</div>${rows}</div>`}
function fillLine(f){return `<div class="rd">Ideal (wallet's own price, no costs) <b class="${cls(f.ideal)}">${sgn(f.ideal)}</b> · lost to delay ${usd(f.delay)}, price impact + DEX fees ${usd(f.impact)}, bot fee ${usd(f.botfee)}, network ${usd(f.netfee)}</div><div class="rd m">Round trip at entry ${f.rt_pct==null?"–":f.rt_pct.toFixed(1)+"%"} · pool ${f.liq_in?usd(f.liq_in,0):"–"} in, ${f.liq_out!=null?usd(f.liq_out,0):"–"} out · priced by ${esc(f.src_in||"–")} / ${esc(f.src_out||"–")}${f.sellable===0?' · <span class="r">could not be sold back at entry</span>':""}</div>`}
function sigCard(s){const after=(s.p1h!=null||s.p24h!=null)?` · after 1 h <b class="${cls(s.p1h)}">${pct(s.p1h,0)}</b>, after 24 h <b class="${cls(s.p24h)}">${pct(s.p24h,0)}</b>`:"";
 return `<div class="row"><div class="rh"><span>${esc(s.coin)} <span class="m s">${esc(s.mint)}</span></span><span class="m s">${T(s.ts)}</span></div>
<div class="rd">${esc(s.wallet)} bought${s.liq!=null?` · pool ${usd(s.liq,0)}`:""}${s.h1!=null?` · 1 h move ${pct(s.h1,0)}`:""}${s.lag!=null?` · spotted ${dur(s.lag)} after`:""}${after}</div>
${(s.holders!=null||s.rt!=null)?`<div class="rd m">${s.holders!=null?`${Number(s.holders).toLocaleString()} holders`:""}${s.holders!=null&&s.rt!=null?" · ":""}${s.rt!=null?`$20 round trip costs ${s.rt.toFixed(1)}%`:""}</div>`:""}<span class="tag t-${s.verdict}">${esc(s.label)}</span></div>`}
let walV="real";
const SHOW_TESTS=false;   // Rage, Nov 14: test and backtest results hidden from this page (still recorded). true shows them again.
function holdT(v){return v==null?"–":v<3600?Math.round(v/60)+" min":(v/3600).toFixed(1)+" h"}
function walRow(r,mt){const badge=r.verdict=="winning"?'<span class="g">winning</span>':r.verdict=="losing"?'<span class="r">losing</span>':`<span class="m">too early (${r.trades}/${mt} trades)</span>`;
 const fl=r.flags.length?` <span class="tag t-killed">${r.flags.map(esc).join(" · ")}</span>`:"";
 return `<div class="row"><div class="rh"><span>${esc(r.name)} <span class="m s">${esc(r.addr)}</span></span><span class="${cls(r.total)}">${sgn(r.total)}</span></div>
 <div class="rd">${badge}${fl}${r.following?"":' · <span class="m">no longer on the Kolscan list</span>'}</div>
 <div class="rd">${r.trades} closed${r.open?`, ${r.open} open`:""} · ${r.win_rate==null?"–":r.win_rate.toFixed(0)+"% won"} · avg ${sgn(r.avg)} a trade · avg hold ${holdT(r.avg_hold_s)}</div>
 <div class="rd">Dumped within ${S.wallet_board.quick_dump_min} min of buying: ${r.judged?`${r.quick} of ${r.judged} buys (${r.quick_pct.toFixed(0)}%)`:"–"}${r.sold_before_copy?` · sold before the bot could copy ${r.sold_before_copy}×`:""}</div>
 ${r.best&&r.trades>1?`<div class="rd m">Best ${esc(r.best.coin)} ${sgn(r.best.pnl)} · worst ${esc(r.worst.coin)} ${sgn(r.worst.pnl)}</div>`:""}</div>`}
function rugCard(){const R=S.rug_filter;if(!R)return"";if(R.error)return`<div class="card"><h3>Rug filter test</h3><div class="warn">${esc(R.error)}</div></div>`;const rs=R.real_same;
 return `<div class="card"><h3>Rug filter test · same $200, skips likely rugs</h3>${b15Acct()}<div class="rd">Takes the same trades as the account above, except it skips pump.fun coins where the top 10 holders own ${R.top10_max}%+ of the supply (not counting the curve or the copied wallet), and coins with a round trip of ${R.rt_max}%+ at entry. Test only: it doesn't change what the main account does. Counts new trades from ${D(R.since)}.</div>
 <div class="grid" style="margin-top:8px"><div class="kv"><span>Rug filter account</span><b class="${cls(R.change_usd)}">${usd(R.equity)}</b><span>${sgn(R.change_usd)} · ${R.closed} closed, ${R.wins} won</span></div><div class="kv"><span>Main account, same period</span><b class="${cls(rs.pnl)}">${sgn(rs.pnl)}</b><span>${rs.closed} closed, ${rs.wins} won</span></div><div class="kv"><span>Coins checked</span><b>${R.checked}</b><span>${R.checked_ok} with holder data</span></div><div class="kv"><span>Would have skipped</span><b>${R.skipped.length}</b></div></div>
 ${R.skipped.length?R.skipped.slice(0,10).map(k=>`<div class="rd">• ${esc(k.coin)} (${esc(k.wallet)}) — ${esc(k.why)} · main account: ${k.real_status=="closed"?`<b class="${cls(k.real_pnl)}">${sgn(k.real_pnl)}</b>`:k.real_status=="open"?"still open":"not bought"}</div>`).join(""):'<div class="rd m">Nothing skipped yet.</div>'}</div>`}
function poolBandCard(){const R=S.pool_band;const hd=`<h3>Pool-band shadow test · logged only, never blocks</h3>`;
 const intro=`<div class="rd">Two versions of a pool-size rule are checked on every new coin: <b>skip pools $30k–46k</b> (on past trades it would have skipped 16 of the 28 big losers and no main-account winner, but the edges were picked around winners) and <b>skip pools under $46k</b> (20 of the 28, but also 7 winners incl. PIRATE). Shadow test only: nothing is ever skipped, and the main account's buys and exits don't change. The pool figure's source is recorded: DexScreener, or RugCheck when DexScreener has none (often pump.fun curve coins, and it can be wrong).</div>`;
 if(!R||R.pending)return `<div class="card">${hd}${intro}<div class="rd m" style="margin-top:6px">Switched on Sat 7 Nov. Starts logging at the next bot run (around 8:30 PM); counts new trades only.</div></div>`;
 if(R.error)return `<div class="card">${hd}<div class="warn">${esc(R.error)}</div></div>`;
 const m=R.accounts[0]||{closed:0};

 if(tab=="hist")h+=`<div class="card"><h3>Closed trades (${x.closed}) · total ${sgn(x.total_pnl)}</h3>${S.history.length?S.history.map(histCard).join(""):'<div class="empty">No closed trades yet.</div>'}</div>`;
 if(tab=="sig"){const F=[["all","All real buys"],["copied","Copied"],["killed","Blocked"],["passed","Passed, not copied"],["skip","Skipped"],["ignored","Not real buys"]];
  const list=S.signals.filter(s=>sigF=="all"?s.verdict!="ignored":s.verdict==sigF);
  h+=`<div class="filt">${F.map(([k,n])=>`<button class="${k==sigF?"act":""}" onclick="sigF='${k}';render()">${n}</button>`).join("")}</div><div class="card"><h3>${list.length} shown, newest first</h3>${list.slice(0,150).map(sigCard).join("")||'<div class="empty">Nothing here yet.</div>'}</div>`}
 if(tab=="stats"){h+=`<div class="card"><h3>Results</h3><div class="grid"><div class="kv"><span>Closed trades</span><b>${x.closed}</b></div><div class="kv"><span>Win rate</span><b>${x.win_rate==null?"–":x.win_rate.toFixed(0)+"%"}</b></div><div class="kv"><span>Total P&amp;L</span><b class="${cls(x.total_pnl)}">${sgn(x.total_pnl)}</b></div><div class="kv"><span>Max drawdown</span><b class="r">${a.mdd_pct.toFixed(1)}%</b><span>${usd(a.mdd_usd)}</span></div><div class="kv"><span>Best</span><b class="g">${x.best?pct(x.best.pnl_pct,0):"–"}</b><span>${x.best?esc(x.best.coin)+" "+sgn(x.best.pnl):""}</span></div><div class="kv"><span>Worst</span><b class="r">${x.worst?pct(x.worst.pnl_pct,0):"–"}</b><span>${x.worst?esc(x.worst.coin)+" "+sgn(x.worst.pnl):""}</span></div></div></div>
  <div class="card"><h3>Are the safety filters helping?</h3><div class="rd" style="margin-bottom:8px">How coins moved after the smart wallet bought: ones the filters blocked versus ones that passed. "Dead" = down 90% or more. Only counts coins the bot was awake to re-check.</div>${cmpRow(`Blocked coins (${x.killed})`,x.compare.killed)}${cmpRow(`Passed coins (${x.survivors})`,x.compare.survivor)}</div>
  <div class="card"><h3>What blocked coins</h3>${x.filters.length?x.filters.map(([k,n])=>`<div class="rh s" style="font-weight:400;padding:4px 0"><span>${esc(k)}</span><span>${n}</span></div>`).join(""):'<div class="empty">Nothing blocked yet.</div>'}</div>
`+(SHOW_TESTS?`  <div class="card"><h3>Test copy of every passed coin</h3>${b15Acct()}<div class="rd">A side test that copies every coin that passes at a flat $20, with no 5-trade limit. It doesn't touch the $200 account.</div><div class="grid" style="margin-top:8px"><div class="kv"><span>Closed</span><b>${x.shadow.n}</b><span>${x.shadow.wins} won</span></div><div class="kv"><span>Total</span><b class="${cls(x.shadow.pnl)}">${sgn(x.shadow.pnl)}</b></div></div></div>`:"")}
 if(tab=="log")h+=`<div class="card"><h3>What the bot did, newest first</h3>${S.activity.length?S.activity.map(e=>`<div class="row"><div class="rh" style="font-weight:400"><span class="${e.kind=="bad"?"r":e.kind=="buy"?"g":e.kind=="sell"?"y":""}">${esc(e.text)}</span><span class="m s" style="white-space:nowrap">${T(e.ts)}</span></div></div>`).join(""):'<div class="empty">Nothing logged yet.</div>'}</div>`;
 if(tab=="wal")h+=cardBoard()+walBoard();
  if(tab=="wal")h+=`<div class="card"><h3>Smart wallets followed (${S.wallets.length})</h3><div class="rd" style="margin-bottom:6px">Top wallets from the Kolscan leaderboard, re-read every 6 hours.</div>${S.wallets.map(w=>`<div class="row"><div class="rh"><span>#${w.rank??"–"} ${esc(w.name)} <span class="m s">${esc(w.addr)}</span></span><span class="${cls(w.pnl_usd)} s">${w.pnl_usd!=null?sgn(w.pnl_usd,0):""}</span></div><div class="rd">${w.wins??0} wins / ${w.losses??0} losses on Kolscan · checked every ${w.every_s}s · last ${w.last_check?ago(S.now-w.last_check):"never"}</div></div>`).join("")}</div>`;
 $("#main").innerHTML=h;$("#foot").innerHTML=`Data from ${TT(S.gen)} Lagos time (${ago(S.now-S.gen)}) · the bot sends new data every 2 min, and this page checks every minute. While this page is open, open-trade prices refresh about every 10 seconds straight from Jupiter (DexScreener as backup)<br><a style="color:var(--mut)" href="${wf}" target="_blank" rel="noopener">The bot runs on GitHub Actions</a><br>Paper mode only: no wallet, no keys, no real money. This page can only watch.`}
function b64(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function fetchBlob(){const u1=`https://api.github.com/repos/${OWNER}/${REPO}/contents/state.enc?ref=data&t=${Date.now()}`;
 try{const r=await fetch(u1,{cache:"no-store",headers:{Accept:"application/vnd.github.raw"}});if(r.ok)return(await r.text()).trim()}catch(e){}
 const r=await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/data/state.enc?t=${Date.now()}`,{cache:"no-store"});if(!r.ok)throw new Error("fetch "+r.status);return(await r.text()).trim()}
async function load(){if(!K){errMsg="This link is missing its key. Open the full link you were sent.";render();return}
 try{const raw=b64((await fetchBlob()).replace(/\s/g,""));const key=await crypto.subtle.importKey("raw",b64(K),"AES-GCM",false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(0,12)},key,raw.slice(12));
  const txt=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  S=JSON.parse(txt);S.gen=S.now;lastOk=Date.now()/1000;errMsg=""}catch(e){if(!S)errMsg=String(e.name)=="OperationError"?"The key in this link doesn't match. Open the full link you were sent.":"Couldn't load the bot's data yet. It will retry by itself."}
 render()}
// ---- live market prices for open paper trades (display only: the bot, its stops and its books are not touched)
const LQ={};let lqIv=10000,lqTimer=null,lqBusy=false,lqErr="",lqLast=0;
const LQ_FRESH=45;
function lpx(v){if(v==null)return"–";if(v>=1)return"$"+v.toFixed(4);return"$"+Number(v.toPrecision(4)).toString()}
function lkey(p){return p.coin+"|"+p.entry_ts}
function lmint(p){if(p.mint_full)return p.mint_full;const re=new RegExp("PAPER BUY \\[acct 1\\] "+p.coin.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+" ([1-9A-HJ-NP-Za-km-z]{32,44}) ");for(const a of (S.activity||[])){const m=re.exec(a.text||"");if(m&&m[1].slice(0,4)==p.mint.slice(0,4))return m[1]}return null}
function lval(p,P){if(!(P>0))return null;if(p.mtm){const m=p.mtm,v=Math.max(0,m.qa*P-m.sub),pnl=v+m.base;return{v,pnl,pc:pnl/p.size*100,exact:true}}
 if(!(p.now_price>0))return null;const got=p.half?p.half.got:0,vb=Math.max(0,p.pnl+p.size-got),qa=vb/p.now_price,v=Math.max(0,vb+qa*(P-p.now_price)),pnl=p.pnl+(v-vb);return{v,pnl,pc:pnl/p.size*100,exact:false}}
async function lqJup(mints){const r=await fetch("https://lite-api.jup.ag/price/v3?ids="+mints.join(","),{cache:"no-store"});if(!r.ok)throw new Error("Jupiter "+r.status);const d=await r.json(),o={};for(const m of mints){const q=d&&d[m];if(q&&+q.usdPrice>0)o[m]=+q.usdPrice}return o}
async function lqDex(ps){const mints=[...new Set(ps.map(x=>x.m))];const r=await fetch("https://api.dexscreener.com/tokens/v1/solana/"+mints.join(",")+"?_="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("DexScreener "+r.status);const d=await r.json(),o={};
 for(const x of ps){const pr=(Array.isArray(d)?d:[]).filter(q=>q.baseToken&&q.baseToken.address==x.m);const q=pr.find(q=>q.pairAddress==x.p.pool)||pr.sort((a,b)=>((b.liquidity||{}).usd||0)-((a.liquidity||{}).usd||0))[0];if(q&&+q.priceUsd>0)o[x.m]=+q.priceUsd}return o}
async function liveTick(){clearTimeout(lqTimer);
 if(!document.hidden&&S&&!lqBusy){const ps=(S.positions||[]).map(p=>({p,m:lmint(p)})).filter(x=>x.m);
  if(ps.length){lqBusy=true;const mints=[...new Set(ps.map(x=>x.m))],now=()=>Date.now()/1000;let n=0,errs=[];
   try{const g=await lqJup(mints);for(const m in g){LQ[m]={prev:LQ[m]&&LQ[m].price,price:g[m],t:now(),src:"Jupiter"};n++}}catch(e){errs.push(String(e.message||e))}
   const miss=ps.filter(x=>!(LQ[x.m]&&now()-LQ[x.m].t<5));if(miss.length){try{const g=await lqDex(miss);for(const m in g){LQ[m]={prev:LQ[m]&&LQ[m].price,price:g[m],t:now(),src:"DexScreener"};n++}}catch(e){errs.push(String(e.message||e))}}
   if(n){lqErr="";lqIv=10000;lqLast=now()}else{lqErr="Price sources didn't answer"+(errs.some(e=>/429/.test(e))?" (rate limit)":"")+", retrying.";lqIv=Math.min(lqIv*2,60000)}
   lqBusy=false}}
 liveFill();lqTimer=setTimeout(liveTick,lqIv)}
function liveFill(){if(!S)return;const now=Date.now()/1000;let all=true,eq=S.account?S.account.cash:null,any=false;
 for(const p of (S.positions||[])){const k=lkey(p),m=lmint(p),q=m&&LQ[m],fresh=q&&now-q.t<LQ_FRESH,l=fresh?lval(p,q.price):null;
  const box=document.querySelector(`[data-lv="${CSS.escape(k)}"]`),hd=document.querySelector(`[data-lvh="${CSS.escape(k)}"]`);
  if(l){any=true;eq+=l.v}else all=false;
  if(hd){if(l){const t=`${sgn(l.pnl)} (${pct(l.pc)})`;if(hd.textContent!=t){hd.textContent=t;hd.className=cls(l.pnl);if(q.prev&&q.prev!=q.price){hd.classList.add(q.price>q.prev?"fu":"fd")}}}else{const t=`${sgn(p.pnl)} (${pct(p.pnl_pct)})`;if(hd.textContent!=t){hd.textContent=t;hd.className=cls(p.pnl)}}}
  if(!box)continue;let h="";
  if(!m)h=`<div class="rd m">Live price: waiting for the bot's next data update (starts with its next run).</div>`;
  else if(l){const mv=(q.price/p.entry_price-1)*100;h=`<div class="rd"><span class="dot on"></span><b>Live ${lpx(q.price)}</b> <span class="${cls(mv)}">${pct(mv)} vs entry</span> · <span class="m">${q.src}, checked ${ago(now-q.t)}</span></div><div class="rd m">If sold now ≈ ${usd(l.v)} after the bot's paper costs${l.exact?"":" (estimate)"}. The P&L at the top uses this live price. It's paper, and a real sale could get less.</div>${q.price<=p.stop?`<div class="rd y">Live price is at or under the stop. The bot sells on its own next price check, not from this page.</div>`:""}`}
  else if(q)h=`<div class="rd y">Live price is old (${ago(now-q.t)}), showing the bot's last numbers.${lqErr?" "+esc(lqErr):""}</div>`;
  else h=`<div class="rd m">${lqErr?esc(lqErr)+" Showing the bot's last numbers.":"Getting live price…"}</div>`;
  if(box.innerHTML!=h)box.innerHTML=h}
 const e=document.getElementById("lveq");if(e){const t=(any&&all&&S.positions.length)?`With live prices now: <b class="${cls(eq-S.account.start)}">${usd(eq)}</b> <span class="m">(updates every ~10 s)</span>`:"";if(e.innerHTML!=t)e.innerHTML=t}}
const _render=render;render=function(){_render();liveFill()};
document.addEventListener("visibilitychange",()=>{if(!document.hidden)liveTick()});
load().then(liveTick);setInterval(load,60000);setInterval(liveFill,1000);
