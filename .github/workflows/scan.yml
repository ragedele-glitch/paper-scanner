name: Rage Meme Bot

# PAPER MODE. No wallet, no keys, nothing is signed or sent on-chain.
# Live mode (live.py) is switched OFF: it only wakes up if the repository variable LIVE_MODE is set to
# dry-run or live, and live also needs the LIVE_WALLET_KEY secret, which does not exist. See LIVE.md.
# Each run follows the smart wallets for about 4 hours, then queues the next run itself.
# The 15-minute schedule is a safety net that restarts it if the chain ever breaks.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: paper-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    env:
      DASH_KEY: ${{ secrets.DASH_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Free Helius key (read-only): used first for the live feed and the RPC reads, public nodes stay as backup.
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      # Live mode settings (repository variables, Settings > Secrets and variables > Actions > Variables).
      # None are set, so LIVE_MODE is empty and live mode stays off.
      LIVE_MODE: ${{ vars.LIVE_MODE }}
      LIVE_WALLET_ADDRESS: ${{ vars.LIVE_WALLET_ADDRESS }}
      LIVE_TRADE_USD: ${{ vars.LIVE_TRADE_USD }}
      LIVE_TOTAL_BUDGET_USD: ${{ vars.LIVE_TOTAL_BUDGET_USD }}
      LIVE_MAX_OPEN: ${{ vars.LIVE_MAX_OPEN }}
      LIVE_DAILY_LOSS_USD: ${{ vars.LIVE_DAILY_LOSS_USD }}
      LIVE_SLIPPAGE_BPS: ${{ vars.LIVE_SLIPPAGE_BPS }}
      LIVE_MAX_PRICE_IMPACT_PCT: ${{ vars.LIVE_MAX_PRICE_IMPACT_PCT }}
      LIVE_MAX_SIGNAL_AGE_S: ${{ vars.LIVE_MAX_SIGNAL_AGE_S }}
      LIVE_MAX_WALLET_USD: ${{ vars.LIVE_MAX_WALLET_USD }}
      LIVE_KILL: ${{ vars.LIVE_KILL }}
      # Rage Radium Bot (real-money copy of the main account). RADIUM_MODE: dry-run (default), live, off.
      RADIUM_MODE: ${{ vars.RADIUM_MODE }}
      RADIUM_WALLET_ADDRESS: ${{ secrets.RADIUM_WALLET_ADDRESS }}
      RADIUM_MAX_LOSS_USD: ${{ vars.RADIUM_MAX_LOSS_USD }}
      RADIUM_MAX_STAKE_USD: ${{ vars.RADIUM_MAX_STAKE_USD }}
      RADIUM_MIN_STAKE_USD: ${{ vars.RADIUM_MIN_STAKE_USD }}
      RADIUM_MAX_OPEN: ${{ vars.RADIUM_MAX_OPEN }}
      RADIUM_DAILY_LOSS_USD: ${{ vars.RADIUM_DAILY_LOSS_USD }}
      RADIUM_TOTAL_LOSS_USD: ${{ vars.RADIUM_TOTAL_LOSS_USD }}
      RADIUM_BUY_SLIPPAGE_BPS: ${{ vars.RADIUM_BUY_SLIPPAGE_BPS }}
      RADIUM_SELL_SLIPPAGE_BPS: ${{ vars.RADIUM_SELL_SLIPPAGE_BPS }}
      RADIUM_MAX_IMPACT_PCT: ${{ vars.RADIUM_MAX_IMPACT_PCT }}
      RADIUM_MAX_LAG_S: ${{ vars.RADIUM_MAX_LAG_S }}
      RADIUM_PRIORITY_MAX_LAMPORTS: ${{ vars.RADIUM_PRIORITY_MAX_LAMPORTS }}
      RADIUM_FEE_RESERVE_SOL: ${{ vars.RADIUM_FEE_RESERVE_SOL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued run waits up to 4 h behind the running one; always start on the newest code, not the commit
          # that was current when it was queued (Nov 7: a run queued at 10:31 UTC would have missed later fixes).
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --quiet "cryptography==50.0.1" "websockets==17.4" "solders==0.29.0"
      - name: Restore saved bot state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: scanner-state-${{ github.run_id }}-start
          restore-keys: scanner-state-
      - name: Prepare
        run: python ci_runner.py prepare

      - name: Scan, hour 1
        run: python ci_runner.py run 58
        env:
          LIVE_WALLET_KEY: ${{ secrets.LIVE_WALLET_KEY }}
          LIVE_RPC_URL: ${{ secrets.LIVE_RPC_URL }}
          JUP_API_KEY: ${{ secrets.JUP_API_KEY }}
          RADIUM_WALLET_KEY: ${{ secrets.RADIUM_WALLET_KEY }}
      - name: Save state 1
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: scanner-state-${{ github.run_id }}-${{ github.run_attempt }}-1

      - name: Scan, hour 2
        run: python ci_runner.py run 58
        env:
          LIVE_WALLET_KEY: ${{ secrets.LIVE_WALLET_KEY }}
          LIVE_RPC_URL: ${{ secrets.LIVE_RPC_URL }}
          JUP_API_KEY: ${{ secrets.JUP_API_KEY }}
          RADIUM_WALLET_KEY: ${{ secrets.RADIUM_WALLET_KEY }}
      - name: Save state 2
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: scanner-state-${{ github.run_id }}-${{ github.run_attempt }}-2

      - name: Scan, hour 3
        run: python ci_runner.py run 58
        env:
          LIVE_WALLET_KEY: ${{ secrets.LIVE_WALLET_KEY }}
          LIVE_RPC_URL: ${{ secrets.LIVE_RPC_URL }}
          JUP_API_KEY: ${{ secrets.JUP_API_KEY }}
          RADIUM_WALLET_KEY: ${{ secrets.RADIUM_WALLET_KEY }}
      - name: Save state 3
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: scanner-state-${{ github.run_id }}-${{ github.run_attempt }}-3

      - name: Scan, hour 4 (queues the next run near the end)
        run: python ci_runner.py run 58 last
        env:
          LIVE_WALLET_KEY: ${{ secrets.LIVE_WALLET_KEY }}
          LIVE_RPC_URL: ${{ secrets.LIVE_RPC_URL }}
          JUP_API_KEY: ${{ secrets.JUP_API_KEY }}
          RADIUM_WALLET_KEY: ${{ secrets.RADIUM_WALLET_KEY }}
      - name: Save state 4
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: scanner-state-${{ github.run_id }}-${{ github.run_attempt }}-4
      - name: Hand Rage Radium Bot to the bridge (also if the run failed or was cancelled)
        if: always()
        run: python ci_runner.py radium-release
